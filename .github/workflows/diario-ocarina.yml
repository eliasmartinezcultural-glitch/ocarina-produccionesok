name: Diario Ocarina · actualización automática

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "diario-ocarina/**"
      - ".github/workflows/diario-ocarina.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: diario-ocarina-pages
  cancel-in-progress: false

jobs:
  actualizar-y-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recopilar, filtrar y clasificar fuentes RSS
        shell: python
        run: |
          import json, re, hashlib, urllib.request, xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime
          from html import unescape
          from pathlib import Path
          import unicodedata

          OUT = Path("diario-ocarina/noticias.json")
          FEEDS = [
              ("Región", "Neuquén Informa · Generales", "https://www.neuqueninforma.gob.ar/rss/generales/"),
              ("Turismo", "Neuquén Informa · Turismo", "https://www.neuqueninforma.gob.ar/rss/turismo/"),
              ("Educación", "Neuquén Informa · Educación", "https://www.neuqueninforma.gob.ar/rss/educacion/"),
          ]
          # Filtro inicial de seguridad editorial. No sustituye la revisión humana.
          BLOCK = re.compile(r"\\b(polic[ií]a|policial|homicidio|asesinato|violaci[oó]n|detuvieron|detenido|allanamiento|robo|asalto|choque|accidente|muert[oa]s?|falleci[oó]|herid[oa]s?|violencia|delito|droga|narcotr[aá]fico|arma|disparo|petr[oó]leo|fracking|vaca muerta|partido pol[ií]tico|campa[nñ]a electoral|candidato|elecciones|elecci[oó]n)\\b", re.I)
          def clean(value):
              value = re.sub(r"<[^>]+>", " ", value or "")
              value = unescape(value)
              return re.sub(r"\\s+", " ", value).strip()
          def norm(value):
              value = unicodedata.normalize("NFD", value or "")
              return "".join(ch for ch in value if unicodedata.category(ch) != "Mn").lower()
          def territory(title, summary, link):
              text = norm(" ".join([title, summary, link]))
              if re.search(r"san patricio del chanar|el chanar|chanar digital|epea 3|epet 26|cef 10", text):
                  return "Chañar"
              if re.search(r"alto valle|villa regina|general roca|cipolletti|cinco saltos|centenario|anelo|plottier|vista alegre|contralmirante cordero|barda del medio", text):
                  return "Cercanías"
              if re.search(r"neuquen|rio negro|patagonia|limay|collon cura|junin de los andes|san martin de los andes|zapala|andacollo|las coloradas|chubut|santa cruz|tierra del fuego", text):
                  return "Patagonia"
              return "Argentina y mundo"
          def parse_date(item):
              raw = item.findtext("pubDate") or ""
              try:
                  dt = parsedate_to_datetime(raw)
                  if dt.tzinfo is None: dt = dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(timezone.utc).isoformat()
              except Exception:
                  return ""
          priority = {"Chañar": 0, "Cercanías": 1, "Patagonia": 2, "Argentina y mundo": 3}
          items, seen = [], set()
          for category, source, url in FEEDS:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"DiarioOcarinaRSS/1.0 (public feed reader)"})
                  with urllib.request.urlopen(req, timeout=18) as response:
                      root = ET.fromstring(response.read(3_000_000))
                  for item in root.findall(".//item"):
                      title = clean(item.findtext("title"))
                      link = (item.findtext("link") or "").strip()
                      summary = clean(item.findtext("description"))
                      date = parse_date(item)
                      if not title or not link or not link.startswith("https://"): continue
                      key = hashlib.sha256(link.encode("utf-8")).hexdigest()
                      if key in seen: continue
                      seen.add(key)
                      if BLOCK.search(title) or BLOCK.search(summary): continue
                      summary = summary[:360].rsplit(" ", 1)[0] + ("…" if len(summary) > 360 else "")
                      region = territory(title, summary, link)
                      items.append({"id":key[:16],"title":title[:220],"summary":summary,"link":link,"date":date,"category":category,"source":source,"territory":region})
              except Exception as exc:
                  print("Feed no disponible:", url, type(exc).__name__)
          items.sort(key=lambda item: (priority.get(item["territory"], 9), item.get("date", "")), reverse=False)
          # Orden territorial primero y cronológico dentro de cada zona.
          items.sort(key=lambda item: (priority.get(item["territory"], 9), item.get("date", "")), reverse=False)
          for region in priority:
              group = [x for x in items if x["territory"] == region]
              group.sort(key=lambda x: x.get("date", ""), reverse=True)
              items = [x for x in items if x["territory"] != region] + group
          items = items[:60]
          data = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "editorial_rule": "Prioridad territorial: San Patricio del Chañar, cercanías, Patagonia y luego Argentina/mundo.",
              "source_note": "Titulares y extractos breves de fuentes originales. Las fuentes oficiales se identifican como tales. La automatización no sustituye la verificación humana.",
              "items": items
          }
          OUT.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
          print("Publicaciones aptas:", len(items))
          print("Clasificación territorial:", {r: sum(1 for x in items if x["territory"] == r) for r in priority})

      - name: Guardar los cambios de noticias
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diario-ocarina/noticias.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar noticias del Diario Ocarina"
            git push
          else
            echo "No hay cambios nuevos en el archivo de noticias."
          fi

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar el sitio completo sin alterar la portada institucional
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
